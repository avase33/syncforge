server:
  port: 8080

spring:
  application:
    name: syncforge
  # Project Loom: one virtual thread per WebSocket connection and request.
  # Collaborative sessions are idle most of the time, blocked on a socket read.
  # A parked virtual thread costs a heap-allocated continuation rather than an OS
  # thread with a reserved stack, so straightforward blocking code per connection
  # stays affordable. (Rationale, not a measured figure — see README.)
  threads:
    virtual:
      enabled: true

# Built-in demo collaborators that draw in the "demo" room on boot, so the
# dashboard is alive with real CRDT merges before any human connects.
syncforge:
  demo:
    enabled: true
  # Only consulted under the "redis" profile.
  redis:
    host: localhost
    port: 6379

logging:
  level:
    com.syncforge: INFO
