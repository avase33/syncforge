<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>syncforge — collaborative canvas</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0f17;
        color: #e5e7eb;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid #1f2937;
        background: #0d1220;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
      header .status { font-size: 12px; color: #9ca3af; }
      header .pill {
        margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px;
        background: #111827; border: 1px solid #1f2937;
      }
      .hint { font-size: 12px; color: #6b7280; padding: 6px 16px; }
      #stage { display: block; width: 100vw; height: calc(100vh - 84px); cursor: crosshair; }
    </style>
  </head>
  <body>
    <header>
      <h1>syncforge</h1>
      <span class="status" id="status">connecting…</span>
      <span class="pill" id="room"></span>
    </header>
    <div class="hint">Double-click to drop a shape · drag to move · open this URL in a second tab to watch it sync</div>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
